name: Publish Signalpost site

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "out/envelopes.jsonl"
      - "out/run-report.json"
      - "scripts/build_site.py"
      - "scripts/site_assets/**"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: Build site
        run: |
          uv sync --frozen
          uv run python scripts/build_site.py --envelopes out/envelopes.jsonl --report out/run-report.json --out out/site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out/site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
